<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02050b"><title>MyFootyLife v1.005</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 15%,#005bff33,transparent 27%),linear-gradient(135deg,#02050b,#06101c 50%,#01040a);color:#f5f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:700px;margin:auto;min-height:100vh;padding:14px}.card{background:#07111ef5;border:1px solid #123e77;border-radius:24px;padding:20px;box-shadow:0 18px 50px #0008;margin-bottom:12px}.logo{text-align:center;padding:35px 5px 20px}.logo h1{font-size:52px;letter-spacing:-4px;font-style:italic;margin:0;font-weight:950}.logo h1 span{color:#168cff}.ball{font-size:48px;margin:18px}.tag{font-size:13px;font-weight:900;color:#168cff}.field{padding:14px 16px;margin:10px 0;border:1px solid #123e70;border-radius:18px;background:#040d18}.field label{display:block;color:#168cff;font-size:11px;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:18px;font-weight:700}.field select option{background:#07101c}.primary{width:100%;padding:17px;border:1px solid #13aaff;border-radius:18px;background:linear-gradient(100deg,#0877ff,#0844d7);color:#fff;font-size:19px;font-weight:950;margin-top:8px}.header{display:flex;justify-content:space-between;align-items:center}.pill{padding:7px 10px;border:1px solid #174d87;border-radius:999px;background:#071425;color:#bcd4ef;font-size:11px;font-weight:900}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:13px;border:1px solid #123861;border-radius:16px;background:#07111e}.stat b{display:block;font-size:23px}.stat span{font-size:10px;color:#8fa1b8;text-transform:uppercase}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #0d2947}.muted,.small{color:#8fa1b8}.small{font-size:11px}.money{color:#58c1ff;font-weight:950}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.nav button,.secondary{padding:10px 6px;border:1px solid #173e6d;background:#071221;color:#cfe2fa;border-radius:13px;font-size:11px;font-weight:900}.nav button.active{background:#0b3d7b;border-color:#168cff}.offer{border:1px solid #16477c;border-radius:17px;padding:14px;margin:9px 0;background:#081729}.offer .club{font-size:18px;font-weight:950}.offer button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:12px;background:#0b74ff;color:white;font-weight:950}.trophy{padding:11px 0;border-bottom:1px solid #0c2846}.modal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(9px);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{width:100%;max-width:620px;max-height:90vh;overflow:auto;padding:22px;border:1px solid #168cff;border-radius:24px;background:#071528;box-shadow:0 0 50px #0075ff44}.choice{width:100%;text-align:left;padding:14px;border-radius:16px;background:#071426;border:1px solid #164b83;color:#fff;margin-top:10px}.choice strong{display:block;font-size:16px}.chance{display:block;margin-top:7px;color:#58bfff;font-weight:950;font-size:12px}.spinner{width:62px;height:62px;border-radius:50%;border:6px solid #12355d;border-top-color:#168cff;border-right-color:#12b9ff;margin:10px auto 18px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}@media(max-width:480px){.logo h1{font-size:43px}.grid3{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app" class="app"></div><div id="modal" class="modal hidden"></div>
<script>
const clubs={"Manchester City":["Premier League","England",5],"Liverpool":["Premier League","England",5],"Arsenal":["Premier League","England",5],"Manchester United":["Premier League","England",4],"Chelsea":["Premier League","England",4],"Tottenham":["Premier League","England",4],"Newcastle United":["Premier League","England",4],"Aston Villa":["Premier League","England",3],"Real Madrid":["La Liga","Spain",5],"Barcelona":["La Liga","Spain",5],"Atletico Madrid":["La Liga","Spain",4],"Bayern Munich":["Bundesliga","Germany",5],"Borussia Dortmund":["Bundesliga","Germany",4],"PSG":["Ligue 1","France",5],"Inter Milan":["Serie A","Italy",5],"AC Milan":["Serie A","Italy",4],"Juventus":["Serie A","Italy",4],"Benfica":["Primeira Liga","Portugal",3],"Ajax":["Eredivisie","Netherlands",3],"Celtic":["Scottish Premiership","Scotland",2]};
const nations=["England","Brazil","France","Germany","Italy","Spain","Portugal","Argentina","Netherlands","Scotland","United States"],positions=["ST","LW","RW","CAM","CM","CDM","CB","LB","RB","GK"],clubNames=Object.keys(clubs);
function fresh(){return{screen:"title",name:"",age:16,nationality:"England",club:"",position:"ST",number:9,overall:65,reputation:10,teamTrust:50,coachTrust:50,wage:10000,contractYears:0,season:1,history:[],trophies:{},offers:[]}}
let S=(()=>{try{return JSON.parse(localStorage.getItem("mfl_v1005"))||fresh()}catch(e){return fresh()}})(), pending=null;
function save(){localStorage.setItem("mfl_v1005",JSON.stringify(S))} function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,n))} function money(n){return"€"+Math.round(n).toLocaleString()+"/wk"} function tier(t){return["","Local","Professional","Strong","Elite","World Class"][t]}
function wage(ov,t){return Math.round((10000+Math.max(0,ov-55)*1450+Math.max(0,t-1)*4500)/500)*500}
function title(){return`<div class="card"><div class="logo"><h1>My<span>Footy</span>Life</h1><div class="ball">⚽</div><div class="tag">YOUR CAREER. YOUR CHOICES. YOUR LEGACY.</div></div><button class="primary" onclick="S.screen='create';render()">START CAREER →</button></div>`}
function create(){return`<div class="card"><div class="header"><h2>Create Player</h2><span class="pill">v1.005</span></div>
${field("PLAYER NAME",`<input id="name" placeholder="Enter player name" value="${esc(S.name)}">`)}
${field("AGE",`<select id="age">${Array.from({length:19},(_,i)=>16+i).map(x=>`<option ${x==S.age?"selected":""}>${x}</option>`).join("")}</select>`)}
${field("NATIONALITY",`<select id="nat">${nations.map(x=>`<option ${x==S.nationality?"selected":""}>${x}</option>`).join("")}</select>`)}
${field("STARTING TEAM",`<select id="club">${clubNames.map(x=>`<option ${x==S.club?"selected":""}>${x}</option>`).join("")}</select>`)}
${field("POSITION",`<select id="pos">${positions.map(x=>`<option ${x==S.position?"selected":""}>${x}</option>`).join("")}</select>`)}
${field("SQUAD NUMBER",`<input id="num" type="number" min="1" max="99" value="${S.number}">`)}
<button class="primary" onclick="confirmPlayer()">CONFIRM PLAYER →</button></div>`}
function field(l,x){return`<div class="field"><label>${l}</label>${x}</div>`}
function confirmPlayer(){S.name=document.getElementById("name").value.trim()||"My Player";S.age=+document.getElementById("age").value;S.nationality=document.getElementById("nat").value;S.club=document.getElementById("club").value;S.position=document.getElementById("pos").value;S.number=clamp(+document.getElementById("num").value||9,1,99);S.overall=Math.floor(62+Math.random()*9);S.wage=wage(S.overall,clubs[S.club][2]);S.screen="dashboard";save();render()}
function shell(c){return`<div class="header"><h2>MyFootyLife</h2><span class="pill">v1.005</span></div><div class="nav">${["dashboard","offers","history","career"].map((x,i)=>`<button class="${S.screen==x?"active":""}" onclick="S.screen='${x}';render()">${["Career","Transfers","History","Profile"][i]}</button>`).join("")}</div>${c}`}
function dashboard(){return shell(`<div class="card"><div class="header"><div><h2>${esc(S.name)}</h2><div class="muted">Age ${S.age} • ${S.position} • #${S.number}</div></div><b style="font-size:28px">${S.overall} <small>OVR</small></b></div><div class="grid3"><div class="stat"><b>${S.reputation}</b><span>Reputation</span></div><div class="stat"><b>${S.teamTrust}</b><span>Team Trust</span></div><div class="stat"><b>${S.coachTrust}</b><span>Coach Trust</span></div></div><div class="row"><span>Club</span><b>${esc(S.club)}</b></div><div class="row"><span>League</span><b>${clubs[S.club][0]}</b></div><div class="row"><span>Weekly wage</span><b class="money">${money(S.wage)}</b></div><div class="row"><span>Contract</span><b>${S.contractYears?S.contractYears+" season(s)":"No contract"}</b></div></div><div class="card"><h3>Season ${S.season}</h3><p class="muted">Simulate the entire season at once.</p><button class="primary" onclick="simulate()">SIMULATE SEASON →</button></div>`)}
function offers(){return shell(`<div class="card"><h3>Transfer Approaches</h3><p class="small">Different clubs can approach each season. Existing contracts keep your wage locked.</p>${S.offers.length?S.offers.map((o,i)=>`<div class="offer"><div class="club">${esc(o.club)}</div><div class="small">${tier(o.tier)} • ${esc(clubs[o.club][0])}</div><div class="money">${money(o.wage)}</div><div class="small">${o.years}-season contract</div><button onclick="accept(${i})">ACCEPT OFFER</button></div>`).join(""):"<p class='muted'>No new approaches yet.</p>"}</div>`)}
function history(){return shell(`<div class="card"><h3>Season History</h3>${S.history.length?S.history.slice().reverse().map(h=>`<div class="row"><div><b>${h.season} — ${esc(h.club)}</b><div class="small">${h.league} • ${h.finish}th</div><div class="small">${h.apps} apps • ${h.minutes} min • ${h.goals} goals • ${h.assists} assists</div></div><b>${h.oldOvr} → ${h.newOvr}</b></div>`).join(""):"<p class='muted'>No completed seasons yet.</p>"}</div>`)}
function career(){let ts=Object.entries(S.trophies);return shell(`<div class="card"><h3>Career Profile</h3>${[["Name",S.name],["Age",S.age],["Nationality",S.nationality],["Club",S.club],["Position",S.position],["Squad Number",S.number],["Overall",S.overall],["Reputation",S.reputation],["Weekly Wage",money(S.wage)]].map(r=>`<div class="row"><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join("")}</div><div class="card"><h3>🏆 Trophy Cabinet</h3>${ts.length?ts.map(([k,v])=>`<div class="trophy">🏆 <b>${v>1?"x"+v+" ":""}${esc(k)}</b></div>`).join(""):"<p class='muted'>No trophies yet.</p>"}</div>`)}
function simulate(){let m=document.getElementById("modal");m.classList.remove("hidden");m.innerHTML='<div class="modalbox" style="text-align:center"><div class="spinner"></div><h2>Simulating Season '+S.season+'...</h2><p class="muted">Calculating matches, development, trophies and the transfer market.</p></div>';setTimeout(runSeason,1700)}
function runSeason(){let old=S.overall,t=clubs[S.club][2],league=clubs[S.club][0];let apps=clamp(Math.round(12+(S.overall-60)*1.15+S.coachTrust*.18+S.teamTrust*.08+(t-1)*5+(Math.random()*10-5)),0,38),minutes=Math.round(apps*(65+Math.random()*25)),factor=Math.max(.35,(S.overall-45)/30)*(S.position=="GK"?.12:S.position=="CB"?.35:.72),goals=Math.max(0,Math.round(apps*factor*(.45+Math.random()*.65))),assists=Math.max(0,Math.round(apps*(S.position=="ST"?.25:.34)*(Math.random()*.75+.55))),finish=clamp(Math.round(22-t*2.8-(S.overall-60)*.16-(S.teamTrust-50)*.05-(apps-20)*.08+(Math.random()*7-3)),1,20);
let euro=finish<=4&&t>=3?"UEFA Champions League":finish<=7&&t>=2?"UEFA Europa League":finish<=12&&t>=2?"UEFA Conference League":null,trophy=null,chance=Math.min(.65,.04+t*.05+Math.max(0,S.overall-70)*.008+(S.teamTrust-50)*.002);
if(Math.random()<chance){let dom=league=="Premier League"?"Premier League":league=="La Liga"?"La Liga":league=="Serie A"?"Serie A":league=="Bundesliga"?"Bundesliga":league=="Ligue 1"?"Ligue 1":"Domestic League";if(Math.random()<.45&&finish<=2)trophy=dom;else if(Math.random()<.4)trophy=league=="Premier League"?"FA Cup":league=="La Liga"?"Copa del Rey":league=="Serie A"?"Coppa Italia":league=="Bundesliga"?"DFB-Pokal":"Domestic Cup"}
if(euro&&Math.random()<Math.min(.55,chance+.08))trophy=euro;
if(trophy)S.trophies[trophy]=(S.trophies[trophy]||0)+1;
let dev=(S.age<=20?2:S.age<=24?1.3:S.age<=28?.7:S.age<=31?.15:-.45)+(apps/38)*1.8+(goals/25)*1.2+(assists/15)*.8+(S.coachTrust-50)/45+(S.reputation-30)/80+(trophy?.9:0)+(euro?.4:0)+(Math.random()*2.6-1.3);if(S.age>=34)dev-=Math.random()*1.2;let change=Math.round(dev);if(Math.random()<.28)change+=Math.random()<.5?-1:1;S.overall=clamp(old+change,1,99);
S.reputation=clamp(S.reputation+Math.round(apps/8+goals/12+assists/15+(finish<=4?3:0)+(trophy?4:0)-(!apps?3:0)));S.teamTrust=clamp(S.teamTrust+Math.round(apps/10+(finish<=4?3:0)+(trophy?3:0)-(apps<10?4:0)+(Math.random()*5-2)));S.coachTrust=clamp(S.coachTrust+Math.round(apps/9+minutes/900+goals/18+(finish<=4?2:0)+(Math.random()*5-2)-(apps<8?4:0)));
let contractBefore=S.contractYears;if(S.contractYears>0)S.contractYears--;S.history.push({season:S.season,club:S.club,league,finish,apps,minutes,goals,assists,oldOvr:old,newOvr:S.overall,trophy:trophy||"",euro:euro||""});if(S.contractYears===0)S.wage=wage(S.overall,t);S.season++;generateOffers();save();showResults(S.history[S.history.length-1],contractBefore)}
function generateOffers(){S.offers=clubNames.filter(c=>c!=S.club).sort(()=>Math.random()-.5).slice(0,4).map(c=>({club:c,tier:clubs[c][2],wage:wage(S.overall,clubs[c][2])+Math.floor(Math.random()*8)*500,years:Math.random()<.6?2:3}))}
function accept(i){let o=S.offers[i];S.club=o.club;S.contractYears=o.years;S.wage=o.wage;S.offers=[];save();close();render()}
function showResults(h,cb){document.getElementById("modal").innerHTML=`<div class="modalbox"><div class="pill">SEASON COMPLETE</div><h2>Season ${h.season}</h2><p class="muted"><b>${esc(h.club)}</b> finished <b>${h.finish}th</b> in the ${esc(h.league)}.</p><div class="grid3"><div class="stat"><b>${h.apps}</b><span>Appearances</span></div><div class="stat"><b>${h.goals}</b><span>Goals</span></div><div class="stat"><b>${h.assists}</b><span>Assists</span></div></div><div class="card"><b>Minutes:</b> ${h.minutes}<br><b>OVR:</b> ${h.oldOvr} → ${h.newOvr} (${h.newOvr-h.oldOvr>0?"+":""}${h.newOvr-h.oldOvr})</div>${h.euro?`<div class="card">European competition: <b>${h.euro}</b></div>`:""}<div class="card">${h.trophy?"🏆 <b>"+h.trophy+"</b>":"No trophy won this season."}</div><div class="card">${cb>0&&S.contractYears>0?"Your contract continues and your wage remains locked.":"Your contract is available for renewal/transfer."}</div><button class="primary" onclick="close();S.screen='dashboard';render()">CONTINUE TO NEXT SEASON →</button></div>`}
function close(){document.getElementById("modal").classList.add("hidden")}
function render(){document.getElementById("app").innerHTML=S.screen=="title"?title():S.screen=="create"?create():S.screen=="offers"?offers():S.screen=="history"?history():career()}render();
</script></body></html>
