<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<title>MyFootyLife</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
main{max-width:540px;margin:auto;padding:18px 15px 40px}h1{font-size:30px;margin:4px 0}h2{font-size:21px}.muted{color:#9ba6b4}
.card{background:#181e27;border:1px solid #2b3543;border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#10151c;border-radius:13px;padding:11px}.label{font-size:11px;color:#9ba6b4}.val{font-size:21px;font-weight:800}
input,select,button{width:100%;padding:13px;margin-top:8px;border-radius:12px;border:1px solid #3a4554;background:#232b36;color:#fff;font-size:16px}
button{background:#2e7ff7;border:0;font-weight:750}.secondary{background:#303947}.danger{background:#983d3d}
.offer{border:1px solid #394553;border-radius:14px;padding:13px;margin:9px 0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#2a3442;font-size:12px;margin:2px}
.timeline{border-left:2px solid #394553;padding-left:13px}.season{margin:12px 0}nav{position:sticky;bottom:8px;display:flex;gap:6px;background:#171d26dd;backdrop-filter:blur(12px);padding:8px;border:1px solid #303947;border-radius:16px}nav button{font-size:12px;margin:0;padding:10px}
.situation-backdrop{position:fixed;inset:0;background:rgba(4,8,14,.84);backdrop-filter:blur(7px);z-index:20;overflow:auto;padding:22px 14px 34px}
.situation{max-width:540px;margin:0 auto;background:#121923;border:1px solid #334155;border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.situation-head{text-align:center;border-bottom:1px solid #2b3543;padding-bottom:14px;margin-bottom:15px}.eyebrow{color:#2e7ff7;font-size:13px;font-weight:800;letter-spacing:1.6px}.situation h2{font-size:26px;margin:7px 0}.situation p{line-height:1.45}.question{color:#58a0ff;font-weight:800;font-size:17px;margin:16px 0 12px}
.choice{position:relative;text-align:left;border:1px solid #344152;background:#18202b;border-radius:16px;padding:14px;margin:10px 0;min-height:128px}.choice.a{border-color:#2f9d67}.choice.b{border-color:#b99a2e}.choice.c{border-color:#b84b4b}.choice-top{display:flex;gap:11px;align-items:flex-start}.letter{width:38px;height:38px;min-width:38px;border-radius:50%;display:grid;place-items:center;font-weight:900}.a .letter{background:#245c43;color:#6ff0a9}.b .letter{background:#66551d;color:#ffe27a}.c .letter{background:#6b2929;color:#ff8c8c}.choice h3{margin:0 0 4px;font-size:17px}.choice-desc{margin:0;color:#c0c8d3;font-size:13px}.odds{margin-left:49px;margin-top:11px;display:flex;gap:14px;flex-wrap:wrap}.odds span{font-size:12px;font-weight:800}.success{color:#61e69a}.failure{color:#ff7f7f}.reward{display:inline-block;margin-top:9px;margin-left:49px;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:900;letter-spacing:.5px}.a .reward{background:#245c43;color:#8af5b9}.b .reward{background:#66551d;color:#ffe27a}.c .reward{background:#6b2929;color:#ff9b9b}.result{margin-top:14px;padding:14px;border-radius:14px;background:#0f151d;border:1px solid #303b4b}.result strong{font-size:18px}.continue{margin-top:12px}
</style>
</head>
<body><main><div id="app"></div></main>
<script>
const VERSION="v1.0003";
const cups={England:["FA Cup","EFL Cup"],Spain:["Copa del Rey"],Italy:["Coppa Italia"],Germany:["DFB-Pokal"],France:["Coupe de France"],Netherlands:["KNVB Cup"],Portugal:["Taça de Portugal"],Belgium:["Belgian Cup"],Turkey:["Turkish Cup"],"United States":["U.S. Open Cup"],Mexico:["Copa MX"],Brazil:["Copa do Brasil"],Argentina:["Copa Argentina"],Colombia:["Copa Colombia"],Chile:["Copa Chile"],Japan:["Emperor's Cup"],"South Korea":["Korean FA Cup"],Australia:["Australia Cup"]};
const clubs={England:[["Burnley",5,2500],["West Ham",4,1700],["Manchester City",1,700]],Spain:[["Alavés",5,2500],["Villarreal",4,1700],["Real Madrid",1,700]],Italy:[["Lecce",5,2500],["Fiorentina",4,1700],["Inter Milan",1,700]],Germany:[["Mainz",5,2500],["Eintracht Frankfurt",4,1700],["Bayern Munich",1,700]],France:[["Nantes",5,2500],["Lyon",4,1700],["Paris Saint-Germain",1,700]],"United States":[["Charlotte FC",5,2500],["Orlando City",4,1800],["Inter Miami",1,800]],Brazil:[["Ceará",5,2500],["Fluminense",4,1700],["Flamengo",1,700]],Argentina:[["Tigre",5,2500],["Racing Club",4,1700],["River Plate",1,700]],Mexico:[["Puebla",5,2500],["Monterrey",4,1700],["Club América",1,700]],Portugal:[["Estoril",5,2500],["Braga",4,1700],["Benfica",1,700]],Netherlands:[["Heracles",5,2500],["AZ",4,1700],["Ajax",1,700]],Belgium:[["Kortrijk",5,2500],["Gent",4,1700],["Club Brugge",1,700]],Turkey:[["Kasımpaşa",5,2500],["Trabzonspor",4,1700],["Galatasaray",1,700]],Japan:[["Shonan Bellmare",5,2500],["Urawa Reds",4,1700],["Kawasaki Frontale",1,700]],Australia:[["Western Sydney",5,2500],["Melbourne Victory",4,1700],["Sydney FC",1,700]]};
const nations=Object.keys(clubs), elite=["Real Madrid","Barcelona","Manchester City","Liverpool","Bayern Munich","Paris Saint-Germain","Inter Milan","Arsenal","Juventus","AC Milan"];
const situations=[
{title:"CHANGE IN TRAINING SCHEDULE",icon:"🏋️",text:"Due to recent results, your coach has decided to change a scheduled rest day into a training day. The squad is expected to report to the training ground tomorrow morning.",question:"How do you approach the session?",choices:[
 {letter:"A",title:"JUST SHOW UP",desc:"Attend the session and get the work done without pushing yourself too much.",chance:88,reward:"LOW REWARD",effects:{coachTrust:2,teamTrust:1,rep:1,ovr:0,apps:0,goals:0,assists:0}},
 {letter:"B",title:"TRAIN AT THE SAME LEVEL AS EVERYONE ELSE",desc:"Put in a solid session and keep pace with the rest of the squad.",chance:67,reward:"MEDIUM REWARD",effects:{coachTrust:4,teamTrust:3,rep:2,ovr:1,apps:0,goals:0,assists:0}},
 {letter:"C",title:"TRAIN HARDER THAN EVERYONE ELSE",desc:"Push yourself beyond the rest of the squad to stand out to the coach.",chance:36,reward:"HIGH REWARD",effects:{coachTrust:7,teamTrust:4,rep:4,ovr:2,apps:1,goals:1,assists:1}}
]},
{title:"COACH NEEDS A RESPONSE",icon:"📋",text:"Your coach asks you to explain why your recent performances have dropped. The answer you give could shape how the staff see you going forward.",question:"How do you respond?",choices:[
 {letter:"A",title:"TAKE RESPONSIBILITY",desc:"Admit the issue and promise to work through it.",chance:91,reward:"LOW REWARD",effects:{coachTrust:3,teamTrust:1,rep:1,ovr:0,apps:0,goals:0,assists:0}},
 {letter:"B",title:"EXPLAIN WHAT HAPPENED",desc:"Give an honest explanation while showing that you are ready to improve.",chance:69,reward:"MEDIUM REWARD",effects:{coachTrust:5,teamTrust:2,rep:2,ovr:1,apps:0,goals:0,assists:0}},
 {letter:"C",title:"CHALLENGE YOURSELF TO PROVE IT",desc:"Tell the coach you want to earn your place back through your performances.",chance:42,reward:"HIGH REWARD",effects:{coachTrust:8,teamTrust:3,rep:4,ovr:2,apps:2,goals:1,assists:1}}
]},
{title:"TEAMMATE ASKS FOR HELP",icon:"🤝",text:"A teammate who has struggled for minutes asks you to stay after training and help them prepare for the next match.",question:"What do you do?",choices:[
 {letter:"A",title:"HELP FOR A FEW MINUTES",desc:"Stay briefly and give them a little help before heading home.",chance:89,reward:"LOW REWARD",effects:{coachTrust:0,teamTrust:3,rep:1,ovr:0,apps:0,goals:0,assists:0}},
 {letter:"B",title:"STAY AND TRAIN TOGETHER",desc:"Give them a proper session and work through the drills together.",chance:72,reward:"MEDIUM REWARD",effects:{coachTrust:2,teamTrust:6,rep:2,ovr:1,apps:0,goals:0,assists:0}},
 {letter:"C",title:"ORGANIZE AN EXTRA SESSION",desc:"Take the lead and put together a serious extra session for both of you.",chance:39,reward:"HIGH REWARD",effects:{coachTrust:4,teamTrust:9,rep:4,ovr:2,apps:1,goals:1,assists:1}}
]},
{title:"MEDIA OPPORTUNITY",icon:"🎙️",text:"A major football outlet wants an interview after your latest performance. Your answer could change how supporters and the football world view you.",question:"How do you handle the interview?",choices:[
 {letter:"A",title:"KEEP IT SIMPLE",desc:"Give short, respectful answers and avoid saying anything controversial.",chance:94,reward:"LOW REWARD",effects:{coachTrust:1,teamTrust:1,rep:1,ovr:0,apps:0,goals:0,assists:0}},
 {letter:"B",title:"SPEAK WITH CONFIDENCE",desc:"Talk openly about your ambitions while keeping the focus on the team.",chance:70,reward:"MEDIUM REWARD",effects:{coachTrust:1,teamTrust:2,rep:5,ovr:1,apps:0,goals:0,assists:0}},
 {letter:"C",title:"MAKE A BOLD STATEMENT",desc:"Put yourself in the spotlight and make it clear that you expect to reach the top.",chance:31,reward:"HIGH REWARD",effects:{coachTrust:2,teamTrust:-2,rep:10,ovr:2,apps:1,goals:1,assists:1}}
]}
];
let S=JSON.parse(localStorage.getItem("scs")||"null");
let pendingSituation=null;
const $=x=>document.getElementById(x);
function save(){localStorage.setItem("scs",JSON.stringify(S))}
function money(n){return "€"+Math.round(n).toLocaleString()}
function esc(x){return String(x).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function start(){let n=$("nation").value;S={name:$("name").value||"Alex Carter",nation:n,pos:$("pos").value,num:+$("num").value||9,age:16,year:2026,club:null,ovr:62,rep:12,teamTrust:50,coachTrust:50,value:750000,money:10000,agent:"Local",offers:clubs[n].map(x=>mk(x)),history:[],trophies:[],careerGoals:0,careerAssists:0,careerMinutes:0,screen:"career"};save();render()}
function mk(x){return{club:x[0],tier:x[1],mins:x[2],fee:Math.max(S?.value||750000,x[1]==1?3000000:500000),role:x[1]==1?"Rotation":"Starter"}}
function render(){if(!S){$("app").innerHTML='<div class="card"><h1>⚽ MyFootyLife</h1><p class="muted">Start at 16 and build a career through retirement.</p><input id="name" placeholder="Player name" value="Alex Carter"><select id="nation">'+nations.map(n=>"<option>"+n+"</option>").join("")+'</select><select id="pos">'+["ST","LW","RW","CAM","CM","CDM","LB","CB","RB","GK"].map(x=>"<option>"+x+"</option>").join("")+'</select><input id="num" type="number" min="1" max="99" value="9"><button onclick="start()">Start Career</button></div>';return}let body=S.screen=="history"?historyPage():S.screen=="offers"?offersPage():dashboard();$("app").innerHTML='<div class="top"><div><h1>⚽ '+esc(S.name)+'</h1><div class="muted">'+S.nation+" • "+S.pos+" #"+S.num+'</div></div><div class="val">'+S.ovr+" OVR</div></div>"+body+'<nav><button onclick="go(\'career\')">Career</button><button onclick="go(\'offers\')">Transfers</button><button onclick="go(\'history\')">History</button><button onclick="refresh()">Refresh</button></nav>';if(pendingSituation)renderSituation()}
function go(x){S.screen=x;save();render()}
function dashboard(){return '<div class="card"><div class="grid"><div class="stat"><div class="label">AGE</div><div class="val">'+S.age+'</div></div><div class="stat"><div class="label">REPUTATION</div><div class="val">'+S.rep+'/100</div></div><div class="stat"><div class="label">VALUE</div><div class="val">'+money(S.value)+'</div></div><div class="stat"><div class="label">COACH TRUST</div><div class="val">'+S.coachTrust+'/100</div></div><div class="stat"><div class="label">TEAM TRUST</div><div class="val">'+S.teamTrust+'/100</div></div><div class="stat"><div class="label">WEEKLY WAGE</div><div class="val">'+money(S.money)+'</div></div></div><h2>'+(S.club||"Choose your first club")+"</h2>"+(S.club?'<button onclick="simulate()">Simulate '+S.year+"/"+String(S.year+1).slice(-2)+"</button>":offersHTML())+'</div>'+(S.age>=21?'<div class="card"><h2>❤️ Life</h2><p class="muted">Relationships unlock at 21.</p><button class="secondary" onclick="life()">Random life event</button></div>':"")+ '<div class="card"><h2>🏆 Trophy Cabinet</h2>'+(S.trophies.length?S.trophies.map(t=>"🏆 "+esc(t)+"<br>").join(""):'<span class="muted">No trophies yet.</span>')+'</div><div class="card"><button class="danger" onclick="reset()">Reset Career</button></div>'}
function offersHTML(){return '<p class="muted">Low tier: more minutes • Mid tier: balanced • Top tier: fewer minutes.</p>'+S.offers.map((o,i)=>'<div class="offer"><b>'+esc(o.club)+'</b><br><span class="pill">Tier '+o.tier+'</span><span class="pill">'+o.role+"</span>"+(o.loan?'<span class="pill">LOAN</span>':"")+(o.surprise?'<span class="pill">⭐ SCOUTED</span>':"")+ '<p>'+o.mins.toLocaleString()+' expected league minutes</p><button onclick="choose('+i+')">Join '+esc(o.club)+"</button></div>").join("")}
function offersPage(){return '<div class="card"><h2>🔄 Transfer Market</h2><p class="muted">Agent: '+S.agent+". Better agents improve refresh quality.</p>"+offersHTML()+'</div><div class="card"><h2>🧑‍💼 Agents</h2><p>Professional €25k • Elite €100k • Superstar €500k • World Class €1m</p><button class="secondary" onclick="agent()">Upgrade Agent</button></div>'}
function historyPage(){return '<div class="card"><h2>📖 Career History</h2>'+(S.history.length?'<div class="timeline">'+S.history.slice().reverse().map(h=>'<div class="season"><b>'+h.year+" — "+esc(h.club)+'</b><p>'+h.apps+" apps • "+h.minutes+" min • "+h.goals+" G • "+h.assists+" A • "+h.rating.toFixed(2)+" rating</p>"+h.trophies.map(t=>"🏆 "+esc(t)+"<br>").join("")+h.intl.map(t=>"🌎 "+esc(t)+"<br>").join("")+"<small>"+h.events.join(" • ")+"</small></div>").join("")+'</div>': '<span class="muted">No seasons completed yet.</span>')+'</div>'}
function choose(i){S.club=S.offers[i].club;S.offers=[];save();render()}
function refresh(){let costs={Local:0,Professional:25000,Elite:100000,Superstar:500000,"World Class":1000000},cost=costs[S.agent]||0;if(S.money<cost){alert("Not enough money.");return}S.money-=cost;makeOffers();S.screen="offers";save();render()}
function makeOffers(){let b=clubs[S.nation].map(mk);if(S.agent!="Local"&&S.rep>=55&&Math.random()<.35){let c=elite[Math.floor(Math.random()*elite.length)];b.push({club:c,tier:1,mins:1000,fee:Math.max(S.value*1.7,5000000),role:"Rotation",surprise:true})}if(S.age>=28&&S.rep>=70&&Math.random()<Math.min(.42,.08+(S.rep-70)*.012)){let c=elite[Math.floor(Math.random()*elite.length)];b.push({club:c,tier:1,mins:1800,fee:Math.max(S.value*2,10000000),role:"Important Player",surprise:true})}if(S.age<=22&&Math.random()<.45){let o=b[Math.floor(Math.random()*b.length)];b.push({...o,club:o.club+" (Loan)",mins:3000,role:"Guaranteed Starter",loan:true})}S.offers=b.sort(()=>Math.random()-.5).slice(0,5)}
function clamp(n){return Math.max(0,Math.min(100,Math.round(n)))}
function simulate(){
let top=["Real Madrid","Manchester City","Bayern Munich","Paris Saint-Germain","Inter Milan"].some(x=>S.club.includes(x)),mins=Math.round((top?1150:2600)*(.85+Math.random()*.25)),apps=Math.max(8,Math.round(mins/82)),goals=S.pos=="GK"?Math.floor(Math.random()*2):Math.max(0,Math.round(mins*(.004+Math.random()*.004)*(S.ovr/75))),assists=Math.max(0,Math.round(goals*(.35+Math.random()*.35))),rating=6.65+Math.random()*.9+(goals>=25?.25:0),ts=[];
(cups[S.nation]||[]).forEach(c=>{if(Math.random()<.14+(S.ovr>82?.08:0))ts.push(c)});if(Math.random()<.15+(S.ovr>80?.12:0))ts.push("League");if(Math.random()<.08+(S.ovr>84?.08:0))ts.push("UEFA Champions League");if(Math.random()<.09)ts.push("UEFA Europa League");if(Math.random()<.07)ts.push("UEFA Conference League");
let ev=[];let fant=rating>=7.55||goals>=28||ts.length>=2,breakout=rating>=7.8||goals>=32;if(fant){S.ovr=Math.min(99,S.ovr+(breakout?4:2));S.rep+=breakout?12:7;S.value*=breakout?1.65:1.3;ev.unshift(breakout?"🚀 BREAKOUT SEASON":"🌟 FANTASTIC YEAR")}if(ts.includes("League")&&ts.length>=2&&Math.random()<.35){S.rep+=15;S.value*=1.25;ev.unshift("🏆 CLUB HISTORY MADE — you led an unlikely trophy run.")}S.ovr=Math.min(99,Math.max(1,S.ovr+Math.round((rating-7)*1.4)));S.rep=clamp(S.rep+Math.max(0,Math.round((rating-7)*8)+Math.round(goals/8)+ts.length*3));S.value=Math.round(S.value*(1+(goals+assists)/250));S.money+=Math.round(S.value*.01);S.careerGoals+=goals;S.careerAssists+=assists;S.careerMinutes+=mins;
let intl=[];if(S.age%4==2&&Math.random()<.75){let comp=["England","Spain","Germany","France","Italy","Portugal","Netherlands","Belgium"].includes(S.nation)?"Euros":["United States","Brazil","Argentina","Mexico","Colombia","Chile"].includes(S.nation)?"Copa América":["Japan","South Korea","Australia"].includes(S.nation)?"World Cup":"AFCON";intl.push(comp+" — "+(Math.random()<.18?"🏆 Winner":"Knockout Stage"))}
S.history.push({year:S.year,club:S.club,apps,minutes:mins,goals,assists,rating,trophies:ts,intl,events:ev});S.trophies.push(...ts);S.year++;S.age++;makeOffers();S.screen="history";save();
if(Math.random()<.72){pendingSituation={situation:situations[Math.floor(Math.random()*situations.length)],result:null};}
render()}
function renderSituation(){let e=pendingSituation.situation;let html='<div class="situation-backdrop"><div class="situation"><div class="situation-head"><div class="eyebrow">SITUATION</div><div style="font-size:34px;margin-top:5px">'+e.icon+'</div><h2>'+esc(e.title)+'</h2><p>'+esc(e.text)+'</p><div class="question">'+esc(e.question)+'</div></div>';
if(!pendingSituation.result){e.choices.forEach((c,i)=>{let cls=i==0?'a':i==1?'b':'c';html+='<button class="choice '+cls+'" onclick="chooseSituation('+i+')"><div class="choice-top"><div class="letter">'+c.letter+'</div><div><h3>'+esc(c.title)+'</h3><p class="choice-desc">'+esc(c.desc)+'</p></div></div><div class="odds"><span class="success">✓ '+c.chance+'% SUCCESS</span><span class="failure">✕ '+(100-c.chance)+'% FAILURE</span></div><span class="reward">'+c.reward+'</span></button>'})}
else{let r=pendingSituation.result;html+='<div class="result"><div style="font-size:28px">'+(r.success?'✅':'❌')+'</div><strong>'+(r.success?'Positive result':'Negative result')+'</strong><p>'+esc(r.message)+'</p><p class="muted">'+formatEffects(r.effects)+'</p></div><button class="continue" onclick="closeSituation()">Continue</button>'}html+='</div></div>';$('app').insertAdjacentHTML('beforeend',html)}
function chooseSituation(i){let e=pendingSituation.situation,c=e.choices[i],success=Math.random()*100<c.chance,ef=c.effects; if(!success)ef={coachTrust:-Math.ceil(Math.abs(ef.coachTrust)*.75),teamTrust:-Math.ceil(Math.abs(ef.teamTrust)*.75),rep:-Math.ceil(Math.abs(ef.rep)*.75),ovr:-Math.ceil(Math.abs(ef.ovr)*.5),apps:-Math.ceil(Math.abs(ef.apps)*.5),goals:-Math.ceil(Math.abs(ef.goals)*.5),assists:-Math.ceil(Math.abs(ef.assists)*.5)};S.coachTrust=clamp(S.coachTrust+ef.coachTrust);S.teamTrust=clamp(S.teamTrust+ef.teamTrust);S.rep=clamp(S.rep+ef.rep);S.ovr=Math.max(1,Math.min(99,S.ovr+ef.ovr));S.careerMinutes=Math.max(0,S.careerMinutes+ef.apps*82);S.careerGoals=Math.max(0,S.careerGoals+ef.goals);S.careerAssists=Math.max(0,S.careerAssists+ef.assists);pendingSituation.result={success,message:success?successMessage(e,c):failureMessage(e,c),effects:ef};save();render()}
function successMessage(e,c){return "Your choice pays off. The staff and squad respond positively to your decision."}
function failureMessage(e,c){return "The decision does not work out this time. The staff and squad are less impressed with your approach."}
function formatEffects(e){let names={coachTrust:"Coach Trust",teamTrust:"Team Trust",rep:"Reputation",ovr:"Overall",apps:"Appearances",goals:"Goals",assists:"Assists"};return Object.keys(names).filter(k=>e[k]).map(k=>names[k]+" "+(e[k]>0?"+":"")+e[k]).join(" • ")||"No career-stat change."}
function closeSituation(){pendingSituation=null;save();render()}
function life(){let x=["😂 Overslept","💸 You Got Scammed","🎮 Gaming Marathon","⭐ Scout Discovery","🔥 Breakthrough Training","📱 Viral Moment","🧑‍🏫 Veteran Mentor","💰 Smart Investment","📰 Media Spotlight"];alert(x[Math.floor(Math.random()*x.length)])}
function agent(){let names=["Local","Professional","Elite","Superstar","World Class"],i=names.indexOf(S.agent);if(i==4)return alert("You already have a World Class agent.");let costs=[0,25000,100000,500000,1000000],next=costs[i+1];if(S.money<next)return alert("Not enough money.");S.money-=next;S.agent=names[i+1];save();render()}
function reset(){if(confirm("Delete this career?")){localStorage.removeItem("scs");S=null;render()}}
render();
</script></body></html>
